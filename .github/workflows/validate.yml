---
name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: telegraf/Dockerfile

  docker-compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dummy .env
        run: cp .env.example .env

      - name: Validate compose config
        run: docker compose config --quiet

      - name: Build telegraf image
        run: docker compose build telegraf

  helm:
    name: Lint and template Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build chart dependencies
        run: helm dependency build helm/speedtest-monitor

      - name: Lint chart
        run: helm lint helm/speedtest-monitor

      - name: Template chart
        run: helm template speedtest-monitor helm/speedtest-monitor
